[dependencies]

[package]
  cjc-version = "1.1.0"
  compile-option = "-O2 -Woff unused"
  description = "比对两个字符串的差异，并按行将差异展示出来"
  link-option = ""
  name = "diffUtils4cj"
  organization = "cangjie_tpc"
  output-type = "dynamic"
  src-dir = ["src","CHANGELOG.md"]
  target-dir = ""
  version = "1.0.2"
  repository = "https://gitcode.com/Cangjie-TPC/diffutils4cj"
  homepage = "https://gitcode.com/Cangjie-TPC/diffutils4cj"
  documentation = "https://gitcode.com/Cangjie-TPC/diffutils4cj/blob/develop/doc/feature_api.md"
  category = ["Utility"]
  license = ["Apache-2.0"]

[target]
  aarch64-linux-ohos = {compile-option = "-BD:/ohos-3.2/out/rk3568/obj/third_party/musl/usr/lib/aarch64-linux-ohos -BD:/ohos-3.2/prebuilts/clang/ohos/linux-x86_64/llvm/bin -LD:/ohos-3.2/prebuilts/clang/ohos/linux-x86_64/llvm/lib/clang/12.0.1/lib/aarch64-linux-ohos -LD:/ohos-3.2/prebuilts/clang/ohos/linux-x86_64/llvm/lib/aarch64-linux-ohos -LD:/ohos-3.2/out/rk3568/obj/third_party/musl/usr/lib/aarch64-linux-ohos --sysroot D:/ohos-3.2/out/rk3568/obj/third_party/musl"}
